name: CI

on:
  pull_request:
    branches: [main, admin]
  push:
    branches: [main, admin]

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    name: Check whether CI is needed
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect non-radio changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          run_ci=false

          if [[ -n "$changed_files" ]]; then
            while IFS= read -r file; do
              case "$file" in
                sites/radio/*|db/migrations/radio/*) ;;
                *) run_ci=true; break ;;
              esac
            done <<< "$changed_files"
          fi

          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"
          if [[ "$run_ci" == "false" ]]; then
            echo "Only radio paths changed; skipping format, lint, and build checks."
          fi

  ci:
    needs: detect-scope
    if: needs.detect-scope.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    name: Run CI checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        run: yarn install

      - name: Check formatting
        run: yarn format:check

      - name: Run linters
        run: yarn lint

      - name: Build all workspaces
        run: yarn build
